# =============================================================================
# Minimal Tmux Configuration with Gruvbox Theme
# Derived from Oh My Tmux (gpakosz/.tmux) - flattened and simplified
# =============================================================================

# -- General Settings ---------------------------------------------------------

set -g default-terminal "tmux-256color"
set -s escape-time 10                     # faster command sequences
set -sg repeat-time 1000                  # comfortable repeat for hjkl resizing
set -s focus-events on

# GNU-Screen compatible prefix (Ctrl-a as secondary prefix)
set -g prefix2 C-a
bind C-a send-prefix -2

set -q -g status-utf8 on                  # expect UTF-8 (tmux < 2.2)
setw -q -g utf8 on

set -g history-limit 50000                # boost history (from your .local)
set -g extended-keys on                   # send full key sequences (Ctrl+Shift, etc.)
set -g allow-passthrough on               # allow apps to send escape sequences through tmux
setw -g aggressive-resize on              # resize window to smallest *active* client, not smallest overall

# -- Display ------------------------------------------------------------------

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 5      # redraw status line every 5 seconds
set -g status-position bottom  # status bar at bottom

# Activity and bell notifications disabled
set -g monitor-activity off
set -g visual-activity off
set-option -g bell-action none
set-option -g visual-bell off

# -- Navigation ---------------------------------------------------------------

# Create session
bind C-c new-session

# Find session
bind C-f command-prompt -p find-session 'switch-client -t %%'

# Session navigation
bind BTab switch-client -l  # move to last session

# Split current window horizontally
bind - split-window -v -c "#{pane_current_path}"
# Split current window vertically
bind _ split-window -h -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# Pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Window navigation
unbind n
unbind p
bind -r C-h previous-window  # select previous window
bind -r C-l next-window      # select next window
bind Tab last-window         # move to last active window

# New window retains current path
bind c new-window -c "#{pane_current_path}"

# -- Copy Mode ----------------------------------------------------------------

bind Enter copy-mode # enter copy mode
bind / copy-mode \; send-keys ?   # prefix + / to search scrollback

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# Auto-copy on mouse drag release (no extra keystroke needed)
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# Double-click to select word, triple-click to select line
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run -d 0.3 \; send -X copy-selection-and-cancel
bind -T root DoubleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H ; send -X select-word ; run -d 0.3 ; send -X copy-selection-and-cancel }

# Quick URL/path grabber: prefix + u to highlight and yank URLs
bind u copy-mode \; send-keys -X search-backward "(https?://|/)[^ ]*"

# Incremental search in copy mode
bind -T copy-mode-vi / command-prompt -ip "(search down)" { send -X search-forward-incremental "%%" }
bind -T copy-mode-vi ? command-prompt -ip "(search up)" { send -X search-backward-incremental "%%" }

# Copy to clipboard — auto-detect platform (macOS: pbcopy, Linux: xclip, fallback: OSC 52)
set -g set-clipboard on
if-shell "command -v pbcopy >/dev/null" \
  "bind y run -b 'tmux save-buffer - | pbcopy'" \
  "if-shell 'command -v xclip >/dev/null' \
    'bind y run -b \"tmux save-buffer - | xclip -selection clipboard\"' \
    'bind y display \"Using OSC 52 (set-clipboard on) — copy via terminal\"'"

# -- Buffers ------------------------------------------------------------------

bind b list-buffers     # list paste buffers
bind p paste-buffer -p  # paste from the top paste buffer
bind P choose-buffer    # choose which buffer to paste from

# -- Mouse Toggle -------------------------------------------------------------

# Mouse on by default (toggle with prefix + m)
set -g mouse on
bind m set -g mouse \; display "Mouse #{?mouse,on,off}"

# Clear both screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

# Keep panes open after command exits (useful for debugging crashed jobs)
set -g remain-on-exit off
bind D set -g remain-on-exit \; display "Remain-on-exit #{?remain-on-exit,on,off}"

# Synchronized panes toggle (type in all panes at once)
bind S setw synchronize-panes \; display "Sync #{?pane_synchronized,on,off}"

# Nested tmux: F12 toggles outer prefix off (keystrokes pass to inner session)
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=#504945,bg=#1d2021" \;\
  set window-status-current-style "fg=#504945,bg=#1d2021" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u window-status-current-style \;\
  refresh-client -S

# Popup terminal (prefix + t) — floating window for quick commands
bind t display-popup -E -w 80% -h 70% -d "#{pane_current_path}"

# TmuxAI popup (prefix + a) — AI assistant that reads your panes
bind a display-popup -E -w 85% -h 80% -d "#{pane_current_path}" "tmuxai"

# Dev layout: editor left, two stacked terminals right
bind M-d new-window -n dev -c "#{pane_current_path}" \;\
  split-window -h -p 40 -c "#{pane_current_path}" \;\
  split-window -v -p 50 -c "#{pane_current_path}" \;\
  select-pane -t 1

# Monitor layout: 3 equal panes for watching logs/jobs
bind M-m new-window -n monitor -c "#{pane_current_path}" \;\
  split-window -h -p 66 -c "#{pane_current_path}" \;\
  split-window -h -p 50 -c "#{pane_current_path}" \;\
  select-layout even-horizontal

# Kill pane without confirmation
bind x kill-pane

# Kill window with confirmation
bind X confirm-before -p "Kill window #W? (y/n)" kill-window

# Zoom pane toggle (already default prefix+z, add visual reminder)
bind z resize-pane -Z \; display "#{?window_zoomed_flag,Zoomed,Unzoomed}"

# Move window left/right
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Reload configuration
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# =============================================================================
# Gruvbox Theme (from your tmux.conf.local)
# =============================================================================

# -- Colors -------------------------------------------------------------------

# Gruvbox color palette
# bg dark: #282828, bg1: #3c3836, fg: #ebdbb2, fg muted: #a89984
# blue: #83a598, yellow: #fabd2f, purple: #d3869b, green: #b8bb26, red: #fb4934

# -- Panes --------------------------------------------------------------------

# Pane borders — active: solid red band, inactive: near-invisible
set -g pane-border-style "fg=#3c3836,bg=#3c3836"
set -g pane-active-border-style "fg=#fb4934,bg=#fb4934,bold"
set -g pane-border-lines heavy
set -g pane-border-indicators both

# Always show pane number in border
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#282828#,bg=#fb4934#,bold]  #P: #{pane_current_command} ,#[fg=#a89984#,bg=#3c3836]  #P: #{pane_current_command} }"

# Highlight focused pane: dim inactive, keep active at native bg
setw -g window-style "fg=#a89984,bg=#1d2021"
setw -g window-active-style "fg=default,bg=#282828"

# Pane indicators (when you hit <prefix> + q)
set -g display-panes-colour "#83a598"
set -g display-panes-active-colour "#83a598"

# -- Status Bar ---------------------------------------------------------------

set -g status-style "fg=#a89984,bg=#282828"
set -g status-left-length 40
set -g status-right-length 160

# Status left: session name
set -g status-left "#[fg=#282828,bg=#fabd2f,bold] #S #[fg=#fabd2f,bg=#282828,none] "

# Status right: prefix indicator, git branch, mem, quota, time
set -g status-right "#{?client_prefix,#[fg=#fabd2f]⌨   ,}#[fg=#b8bb26]#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/ /')   #[fg=#a89984]#(~/.local/bin/tmux-mem)   #(~/.local/bin/tmux-quota)   #[fg=#665c54]%R   %d %b  "

# -- Windows ------------------------------------------------------------------

# Window status (inactive) — powerline style
setw -g window-status-style "fg=#a89984,bg=#3c3836,none"
setw -g window-status-format "#[fg=#282828,bg=#3c3836]#[fg=#a89984,bg=#3c3836] #I #W#{?window_zoomed_flag, Z,}#{?#{>:#{window_panes},1},(#{window_panes}),} #[fg=#3c3836,bg=#282828]"

# Window status (active/current) — powerline style
setw -g window-status-current-style "fg=#282828,bg=#83a598,bold"
setw -g window-status-current-format "#[fg=#282828,bg=#83a598]#[fg=#282828,bg=#83a598,bold] #I #W#{?window_zoomed_flag, Z,}#{?#{>:#{window_panes},1},(#{window_panes}),} #[fg=#83a598,bg=#282828]"

# Window activity (disabled)
setw -g window-status-activity-style "fg=default,bg=default,none"

# Window last
setw -g window-status-last-style "fg=#83a598,bg=#3c3836"

# Separator between windows
setw -g window-status-separator ""

# -- Messages -----------------------------------------------------------------

set -g message-style "fg=#282828,bg=#fabd2f,bold"
set -g message-command-style "fg=#fabd2f,bg=#282828,bold"

# -- Mode (copy mode, etc) ----------------------------------------------------

setw -g mode-style "fg=#282828,bg=#fabd2f,bold"

# -- Clock --------------------------------------------------------------------

setw -g clock-mode-colour "#83a598"
setw -g clock-mode-style 24

# -- Terminal Title -----------------------------------------------------------

set -g set-titles-string "#h ❐ #S ● #I #W"

# =============================================================================
# True Color Support (24-bit)
# =============================================================================

# Enable true color support for modern terminals
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",alacritty:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"

# iTerm2 true color
set -ga terminal-overrides ",xterm*:Tc"

# Undercurl support (Ghostty, kitty, iTerm2, WezTerm)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # styled underlines
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underline colors

# OSC 52 clipboard support (copy over SSH)
set -as terminal-overrides ',xterm*:Ms=\E]52;c;%p2%s\a'

# Cursor shape passthrough (beam in insert mode, block in normal)
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# =============================================================================
# End of Configuration
# =============================================================================
